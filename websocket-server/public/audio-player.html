<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player - Recordings</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="audio-player.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 Audio Player</h1>
            <div class="connection-status">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </header>

        <main>
            

            <div class="playlist-section">
                <div class="playlist-header">
                    <h3>Playlist</h3>
                    <button id="refreshBtn" class="refresh-btn" title="Refresh">
                        <span class="material-icons">refresh</span>
                    </button>
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="host">Host</button>
                    <button class="filter-btn" data-filter="speaker">Speaker</button>
                </div>
                <div id="playlist" class="playlist">
                    <div class="loading">Loading recordings...</div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="audio-player.js"></script>
</body>
</html>
