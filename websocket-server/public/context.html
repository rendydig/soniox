<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context</title>
    <link rel="stylesheet" href="index.css">
    <style>
        html, body {
            height: 100%;
        }

        body {
            min-height: 100%;
        }

        #context-root {
            position: relative;
            height: 100vh;
            padding: 30px 8px 8px 8px;
            display: flex;
            flex-direction: column;
        }

        .pane-controls {
            position: absolute;
            top: 4px;
            right: 8px;
            z-index: 10;
            display: flex;
            gap: 4px;
        }

        .pane-control-btn {
            width: 22px;
            height: 22px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.15);
            color: #4b5563;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pane-control-btn:hover {
            background: rgba(0, 0, 0, 0.3);
        }

        #context-root .card.context-card {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .context-header {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        /* Text buttons, sized like the round pane controls but label-wide. */
        .context-btn {
            width: auto;
            padding: 0 10px;
            border-radius: 11px;
            font-size: 11px;
            font-weight: 600;
        }

        .context-row {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .context-select {
            flex: 1;
            min-width: 0;
            padding: 4px 6px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
            color: #1f2937;
            font-size: 12px;
        }

        .context-path {
            flex: 0 0 auto;
            color: #6b7280;
            font-size: 11px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .context-chips {
            flex: 0 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 8px;
        }

        .context-chip {
            display: flex;
            align-items: center;
            gap: 4px;
            max-width: 100%;
            padding: 2px 6px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #f9fafb;
            color: #374151;
            font-size: 11px;
            cursor: pointer;
        }

        .context-chip:hover {
            background: #ecfdf5;
            border-color: #10b981;
        }

        .context-chip.selected {
            background: rgba(5, 150, 105, 0.12);
            border-color: #10b981;
            color: #065f46;
            font-weight: 600;
        }

        .context-chip.problem {
            color: #b91c1c;
            border-color: #fca5a5;
        }

        .context-chip-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .context-chip-forget {
            border: none;
            background: transparent;
            color: inherit;
            font-size: 12px;
            line-height: 1;
            padding: 0 2px;
            cursor: pointer;
        }

        .context-badge {
            flex: 0 0 auto;
            padding: 2px 6px;
            border-radius: 8px;
            background: #fee2e2;
            color: #b91c1c;
            font-size: 11px;
            font-weight: 600;
        }

        .context-editor {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .context-textarea {
            flex: 1;
            min-height: 0;
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
            color: #1f2937;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
            resize: none;
        }

        .context-textarea:disabled {
            background: #f3f4f6;
            color: #6b7280;
        }

        .context-preview {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
            color: #1f2937;
            font-size: 13px;
        }

        .context-footer {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 6px;
            font-size: 11px;
        }

        .context-hint {
            color: #6b7280;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .context-save-status {
            flex: 0 0 auto;
            color: #059669;
            font-weight: 600;
        }

        .context-save-status.error {
            color: #b91c1c;
        }

        .context-save-status.saving {
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div id="context-root"></div>
    <script type="module" src="context-app.js"></script>
</body>
</html>
