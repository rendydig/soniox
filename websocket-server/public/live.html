<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live View</title>
    <link rel="stylesheet" href="index.css">
    <style>
        html, body {
            height: 100%;
        }

        body {
            min-height: 100%;
        }

        #live-root {
            position: relative;
            height: 100vh;
            overflow: hidden;
        }

        #live-root .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: none;
        }

        #live-root .header {
            flex: 0 0 auto;
            padding-right: 36px;
            /* Dot + Translation/Correction toggles hug the left edge. */
            justify-content: flex-start;
        }

        #live-root .main-content {
            flex: 1;
            min-height: 0;
            gap: 0;
        }

        #live-root .split-view {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #live-root .card.live-view {
            height: auto;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        #live-root .live-text {
            flex: 1;
            min-height: 0;
            max-height: none;
            margin-bottom: 0;
        }

        .pane-controls {
            position: absolute;
            top: 4px;
            right: 8px;
            z-index: 10;
            display: flex;
            gap: 4px;
        }

        .pane-control-btn {
            width: 22px;
            height: 22px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.15);
            color: #4b5563;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pane-control-btn:hover {
            background: rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div id="live-root"></div>
    <script type="module" src="live-app.js"></script>
</body>
</html>
